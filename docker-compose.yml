services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
    ports: [ "5432:5432" ]
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: [ "6379:6379" ]

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bash -c "bin/rails db:prepare db:seed && bin/rails server -b 0.0.0.0"
    environment:
      DB_HOST: db
      DB_PASSWORD: postgres
      REDIS_URL: redis://redis:6379/0
      SIDEKIQ_EMBEDDED: "true"
      APP_URL: http://localhost:3000
    ports: [ "3000:3000" ]
    volumes: [ ".:/rails" ]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

volumes:
  pgdata:
